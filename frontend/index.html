<title>VulnExplain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* Brutalist security terminal — ink on paper, acid green accents, zero decoration */
  :root {
    --bg: #f0ede8;
    --surface: #e8e4de;
    --surface2: #dedad3;
    --border: #c8c2b8;
    --fg: #1a1714;
    --fg-muted: #7a746c;
    --accent: #b8ff00;
    --accent-dark: #8cc200;
    --red: #d63030;
    --orange: #d96820;
    --yellow: #c8900a;
    --green: #2a8a3e;
    --blue: #1a5fa8;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0d0b;
      --surface: #171512;
      --surface2: #1f1d19;
      --border: #2e2b25;
      --fg: #f0ede8;
      --fg-muted: #7a746c;
      --accent: #b8ff00;
      --accent-dark: #8cc200;
      --red: #ff4444;
      --orange: #ff7a30;
      --yellow: #ffb020;
      --green: #3ecf5a;
      --blue: #4a9eff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0d0b;
    --surface: #171512;
    --surface2: #1f1d19;
    --border: #2e2b25;
    --fg: #f0ede8;
    --fg-muted: #7a746c;
    --accent: #b8ff00;
    --accent-dark: #8cc200;
    --red: #ff4444;
    --orange: #ff7a30;
    --yellow: #ffb020;
    --green: #3ecf5a;
    --blue: #4a9eff;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    min-height: 100%;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-block: 32px 24px;
    border-bottom: 2px solid var(--fg);
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 0;
  }

  .brand-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }

  .brand-name .vuln { color: var(--fg); }
  .brand-name .explain {
    color: var(--fg);
    background: var(--accent);
    padding: 2px 6px;
    margin-left: 2px;
  }

  .header-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1.5px solid var(--fg);
    color: var(--fg);
  }

  /* ── Scan form ── */
  .scan-section {
    margin-bottom: 40px;
  }

  .scan-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 10px;
  }

  .scan-row {
    display: flex;
    gap: 0;
    border: 2px solid var(--fg);
    background: var(--surface);
  }

  .scan-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--fg);
    outline: none;
  }
  .scan-input::placeholder { color: var(--fg-muted); }

  .scan-btn {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 14px 28px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, color 0.1s;
    flex-shrink: 0;
  }
  .scan-btn:hover { background: var(--accent); color: var(--fg); }
  .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .scan-btn:disabled:hover { background: var(--fg); color: var(--bg); }

  /* ── Status ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-muted);
    border-top: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-dark);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Summary stats ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0;
    border: 2px solid var(--fg);
    margin-bottom: 40px;
  }

  .stat-cell {
    padding: 20px 24px;
    border-right: 1.5px solid var(--fg);
  }
  .stat-cell:last-child { border-right: none; }

  .stat-cell .s-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  .stat-cell .s-value {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }
  .stat-cell.c-red .s-value { color: var(--red); }
  .stat-cell.c-orange .s-value { color: var(--orange); }
  .stat-cell.c-yellow .s-value { color: var(--yellow); }
  .stat-cell.c-green .s-value { color: var(--green); }

  /* ── Section header ── */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1.5px solid var(--border);
  }
  .section-title {
    font-size: 12px;
    font-family: var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .section-count {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--fg-muted);
  }

  /* ── Vuln cards ── */
  .vuln-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 60px; }

  .vuln-card {
    border: 1.5px solid var(--border);
    border-top: none;
    background: var(--surface);
    transition: background 0.1s;
  }
  .vuln-card:first-child { border-top: 1.5px solid var(--border); }

  .vuln-card.sev-CRITICAL { border-left: 4px solid var(--red); }
  .vuln-card.sev-HIGH     { border-left: 4px solid var(--orange); }
  .vuln-card.sev-MEDIUM   { border-left: 4px solid var(--yellow); }
  .vuln-card.sev-LOW      { border-left: 4px solid var(--green); }
  .vuln-card.sev-UNKNOWN  { border-left: 4px solid var(--border); }

  .vuln-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }
  .vuln-header:hover { background: var(--surface2); }

  .sev-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sev-CRITICAL .sev-dot { background: var(--red); }
  .sev-HIGH     .sev-dot { background: var(--orange); }
  .sev-MEDIUM   .sev-dot { background: var(--yellow); }
  .sev-LOW      .sev-dot { background: var(--green); }
  .sev-UNKNOWN  .sev-dot { background: var(--fg-muted); }

  .vuln-id {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    min-width: 200px;
    flex-shrink: 0;
  }

  .vuln-pkg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-muted);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sev-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1.5px solid currentColor;
    flex-shrink: 0;
  }
  .sev-CRITICAL { color: var(--red); }
  .sev-HIGH     { color: var(--orange); }
  .sev-MEDIUM   { color: var(--yellow); }
  .sev-LOW      { color: var(--green); }
  .sev-UNKNOWN  { color: var(--fg-muted); }

  .chevron {
    width: 16px; height: 16px;
    color: var(--fg-muted);
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .vuln-card.open .chevron { transform: rotate(90deg); }

  /* ── Vuln body ── */
  .vuln-body {
    display: none;
    padding: 0 20px 20px 44px;
    border-top: 1px solid var(--border);
  }
  .vuln-card.open .vuln-body { display: block; }

  .vuln-summary-text {
    font-size: 13px;
    color: var(--fg-muted);
    padding: 12px 0 16px;
    font-style: italic;
  }

  .block-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
    margin-top: 16px;
  }
  .block-label:first-of-type { margin-top: 0; }

  .explanation-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--fg);
  }

  .fix-box {
    background: var(--surface2);
    border: 1.5px solid var(--accent-dark);
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--fg);
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .copy-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--fg);
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
    font-weight: 600;
  }
  .copy-btn:hover { background: var(--accent-dark); }

  .listen-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--fg-muted);
    border: 1.5px solid var(--border);
    padding: 3px 10px;
    cursor: pointer;
    margin-left: 8px;
  }
  .listen-btn:hover { border-color: var(--accent-dark); color: var(--fg); }
  .listen-btn.loading { opacity: 0.5; cursor: wait; }

  .refs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .ref-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 300px;
  }
  .ref-link:hover { opacity: 0.7; }

  /* ── Error ── */
  .error-bar {
    border: 2px solid var(--red);
    color: var(--red);
    padding: 12px 16px;
    font-size: 13px;
    font-family: var(--mono);
    margin-bottom: 20px;
  }

  /* ── Empty ── */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--fg-muted);
    font-family: var(--mono);
    font-size: 13px;
    border: 2px dashed var(--border);
  }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  /* ── Dark mode toggle ── */
  .theme-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--fg-muted);
    border: 1.5px solid var(--border);
    padding: 5px 12px;
    cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--fg); color: var(--fg); }

  /* ── Scan history ── */
  .history-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .history-chip {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 4px 10px;
    cursor: pointer;
    color: var(--fg-muted);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-chip:hover { border-color: var(--fg); color: var(--fg); }
  .history-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }

  /* ── Export btn ── */
  .export-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    color: var(--fg-muted);
    border: 1.5px solid var(--border);
    padding: 5px 12px;
    cursor: pointer;
    margin-left: auto;
    display: block;
    margin-bottom: 12px;
  }
  .export-btn:hover { border-color: var(--accent-dark); color: var(--fg); }

  /* ── Footer ── */
  .footer {
    border-top: 1.5px solid var(--border);
    padding-block: 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  @media (max-width: 600px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .stat-cell { border-bottom: 1.5px solid var(--fg); }
    .vuln-id { min-width: 0; font-size: 11px; }
    .vuln-pkg { display: none; }
    .vuln-body { padding-left: 20px; }
  }
</style>

<div class="header">
  <div class="brand">
    <div class="brand-name">
      <span class="vuln">Vuln</span><span class="explain">Explain</span>
    </div>
  </div>
  <div class="header-tags">
    <span class="tag">OSV.dev</span>
    <span class="tag">Gemma 4</span>
    <span class="tag">Sarvam AI</span>
    <span class="tag">Multi-Agent</span>
    <span class="tag">Open Source</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">Dark</button>
  </div>
</div>
<div id="historySection" hidden>
  <div class="history-label">Recent scans</div>
  <div class="history-row" id="historyRow"></div>
</div>

<div class="scan-section">
  <div class="scan-label">GitHub repository URL</div>
  <form id="scanForm">
    <div class="scan-row">
      <input
        class="scan-input"
        type="url"
        id="repoUrl"
        placeholder="https://github.com/owner/repo"
        required
        autocomplete="off"
        spellcheck="false"
      >
      <button class="scan-btn" type="submit" id="scanBtn">Scan →</button>
    </div>
  </form>
</div>

<div id="statusBar" class="status-bar" hidden>
  <div class="spinner"></div>
  <span id="statusText">Scanning…</span>
</div>

<div id="errorBar" class="error-bar" hidden></div>
<div id="summary" hidden></div>
<div id="results"></div>

<div class="footer">
  <span>VulnExplain — Hacktoberfest Hack Day Bengaluru 2026</span>
  <span>Team TheCockroaches</span>
</div>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:8000' : '';
  let lastScanData = null;

  // ── Theme toggle ──
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  try {
    const saved = localStorage.getItem('ve-theme');
    if (saved) { root.dataset.theme = saved; themeBtn.textContent = saved === 'dark' ? 'Light' : 'Dark'; }
  } catch(e) {}
  window.toggleTheme = function() {
    const isDark = root.dataset.theme === 'dark' || (!root.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    root.dataset.theme = next;
    themeBtn.textContent = next === 'dark' ? 'Light' : 'Dark';
    try { localStorage.setItem('ve-theme', next); } catch(e) {}
  };

  // ── Scan history ──
  function loadHistory() {
    try {
      const h = JSON.parse(localStorage.getItem('ve-history') || '[]');
      if (!h.length) return;
      const row = document.getElementById('historyRow');
      row.innerHTML = h.map(url => `<button class="history-chip" title="${escHtml(url)}" onclick="fillHistory('${escHtml(url)}')">${escHtml(url.replace('https://github.com/', ''))}</button>`).join('');
      document.getElementById('historySection').hidden = false;
    } catch(e) {}
  }
  function saveHistory(url) {
    try {
      let h = JSON.parse(localStorage.getItem('ve-history') || '[]');
      h = [url, ...h.filter(u => u !== url)].slice(0, 3);
      localStorage.setItem('ve-history', JSON.stringify(h));
      loadHistory();
    } catch(e) {}
  }
  window.fillHistory = function(url) {
    repoInput.value = url;
    repoInput.focus();
  };
  loadHistory();

  // ── Sarvam TTS ──
  let currentAudio = null;
  window.speakExplanation = async function(btn) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const idx = btn.dataset.idx;
    const text = document.getElementById(`exp-${idx}`)?.textContent?.trim();
    if (!text) return;
    btn.textContent = '… Loading';
    btn.classList.add('loading');
    try {
      const res = await fetch(`${API}/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error('TTS failed');
      const { audio_b64 } = await res.json();
      const binary = atob(audio_b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.play();
      btn.textContent = '⏹ Stop';
      btn.classList.remove('loading');
      currentAudio.onended = () => { btn.textContent = '▶ Listen'; currentAudio = null; };
      btn.onclick = function() {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; btn.textContent = '▶ Listen'; }
        btn.onclick = () => speakExplanation(btn);
      };
    } catch(e) {
      btn.textContent = '▶ Listen';
      btn.classList.remove('loading');
    }
  };

  // ── Export JSON ──
  window.exportJSON = function() {
    if (!lastScanData) return;
    const blob = new Blob([JSON.stringify(lastScanData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vulnexplain-${Date.now()}.json`;
    a.click();
  };

  const form = document.getElementById('scanForm');
  const repoInput = document.getElementById('repoUrl');
  const scanBtn = document.getElementById('scanBtn');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const errorBar = document.getElementById('errorBar');
  const summaryEl = document.getElementById('summary');
  const resultsEl = document.getElementById('results');

  function showError(msg) { errorBar.textContent = msg; errorBar.hidden = false; }
  function clearError() { errorBar.hidden = true; }
  function setStatus(msg, visible = true) { statusText.textContent = msg; statusBar.hidden = !visible; }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderSummary(data) {
    const sev = data.severity_summary || {};
    summaryEl.innerHTML = `
      <div class="summary">
        <div class="stat-cell">
          <div class="s-label">Packages</div>
          <div class="s-value">${data.total_packages_scanned}</div>
        </div>
        <div class="stat-cell">
          <div class="s-label">Total Vulns</div>
          <div class="s-value">${data.total_vulnerabilities_found}</div>
        </div>
        <div class="stat-cell c-red">
          <div class="s-label">Critical</div>
          <div class="s-value">${sev.CRITICAL || 0}</div>
        </div>
        <div class="stat-cell c-orange">
          <div class="s-label">High</div>
          <div class="s-value">${sev.HIGH || 0}</div>
        </div>
        <div class="stat-cell c-yellow">
          <div class="s-label">Medium</div>
          <div class="s-value">${sev.MEDIUM || 0}</div>
        </div>
        <div class="stat-cell c-green">
          <div class="s-label">Low</div>
          <div class="s-value">${sev.LOW || 0}</div>
        </div>
        <div class="stat-cell">
          <div class="s-label">Dep File</div>
          <div class="s-value" style="font-size:16px;letter-spacing:0">${escHtml(data.dependency_file)}</div>
        </div>
      </div>`;
    summaryEl.hidden = false;
  }

  function renderVulns(vulns, totalCount) {
    if (!vulns || !vulns.length) {
      resultsEl.innerHTML = `<div class="empty-state"><div class="big">✓</div>No vulnerabilities found.</div>`;
      return;
    }

    const note = totalCount > vulns.length
      ? `<div class="section-head"><span class="section-title">Top vulnerabilities</span><span class="section-count">Showing top ${vulns.length} of ${totalCount} — sorted by severity</span></div>`
      : `<div class="section-head"><span class="section-title">Vulnerabilities</span><span class="section-count">${vulns.length} found</span></div>`;

    const exportBtn = `<button class="export-btn" onclick="exportJSON()">⬇ Export JSON</button>`;

    resultsEl.innerHTML = note + exportBtn + `<div class="vuln-list">${vulns.map((v, i) => {
      const sev = (v.severity || 'UNKNOWN').toUpperCase();
      const refs = (v.references || []).filter(Boolean);
      return `
        <div class="vuln-card sev-${sev}" id="card-${i}">
          <div class="vuln-header" onclick="toggleCard(${i})">
            <div class="sev-dot"></div>
            <div class="vuln-id">${escHtml(v.id)}</div>
            <div class="vuln-pkg">${escHtml(v.package)} ${escHtml(v.version || '')} · ${escHtml(v.ecosystem)}</div>
            <span class="sev-badge sev-${sev}">${sev}</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
          <div class="vuln-body">
            ${v.summary && v.summary !== 'No summary available' ? `<div class="vuln-summary-text">${escHtml(v.summary)}</div>` : ''}
            <div class="block-label" style="display:flex;align-items:center;gap:8px;">
              <span>Gemma 4 Explanation</span>
              <button class="listen-btn" id="listen-${i}" data-idx="${i}" onclick="speakExplanation(this)">&#9654; Listen</button>
            </div>
            <div class="explanation-text" id="exp-${i}">${escHtml(v.explanation || 'No explanation available.')}</div>
            ${v.fix ? `
            <div class="block-label" style="margin-top:16px;">Fix</div>
            <div class="fix-box">
              <span>${escHtml(v.fix)}</span>
              <button class="copy-btn" onclick="copyFix(event, '${escHtml(v.fix)}')">Copy</button>
            </div>` : ''}
            ${refs.length ? `
            <div class="block-label" style="margin-top:16px;">References</div>
            <div class="refs">${refs.map(r => `<a href="${escHtml(r)}" target="_blank" rel="noopener noreferrer" class="ref-link">${escHtml(r)}</a>`).join('')}</div>` : ''}
          </div>
        </div>`;
    }).join('')}</div>`;

    if (vulns.length) toggleCard(0);
  }

  window.toggleCard = function(i) {
    document.getElementById(`card-${i}`)?.classList.toggle('open');
  };

  window.copyFix = function(e, text) {
    e.stopPropagation();
    navigator.clipboard.writeText(text).catch(() => {});
    e.target.textContent = 'Copied!';
    setTimeout(() => e.target.textContent = 'Copy', 1500);
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = repoInput.value.trim();
    if (!url) return;

    clearError();
    summaryEl.hidden = true;
    resultsEl.innerHTML = '';
    scanBtn.disabled = true;
    setStatus('Agent 1 — fetching dependency file…');

    try {
      setTimeout(() => setStatus('Agent 2 — checking OSV.dev for vulnerabilities…'), 2000);
      setTimeout(() => setStatus('Agent 3 — Gemma 4 explaining vulnerabilities…'), 5000);

      const res = await fetch(`${API}/scan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo_url: url }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      lastScanData = data;
      saveHistory(url);
      setStatus('', false);
      renderSummary(data);
      renderVulns(data.top_vulnerabilities, data.total_vulnerabilities_found);
    } catch (err) {
      setStatus('', false);
      if (err.message.includes('fetch') || err.message.includes('Network')) {
        showError('Cannot reach the backend. Make sure it\'s running: cd backend && python main.py');
      } else {
        showError(err.message);
      }
    } finally {
      scanBtn.disabled = false;
    }
  });
</script>
